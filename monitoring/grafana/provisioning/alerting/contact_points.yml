apiVersion: 1

# Grafana Alerting contact points provisioned from file.
# Add/edit entries here then restart Grafana; changes are applied automatically.
# Documentation: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

contactPoints:
  - orgId: 1
    name: tracelens-default
    receivers:
      # Webhook placeholder — replace url with a real endpoint (Slack incoming-webhook,
      # PagerDuty events URL, or an Alertmanager receiver) to activate notifications.
      - uid: tracelens-webhook
        type: webhook
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK_URL:-http://localhost:9999/alert}
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: tracelens-default
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: tracelens-default
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
