# TraceLens full-stack dev environment.
#
#   docker compose up --build    # starts Postgres + Adminer + ingestion + api + frontend
#   Grafana:    http://localhost:3001  (admin / admin — change on first login)
#   Prometheus: http://localhost:9090
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelens}
      POSTGRES_DB: ${POSTGRES_DB:-tracelens}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tracelens}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight web UI for inspecting the database during development.
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Application services ---
  ingestion:
    build:
      context: .
      dockerfile: packages/ingestion/Dockerfile
    environment:
      INGESTION_PORT: ${INGESTION_PORT:-4001}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-dev-ingest-key}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tracelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelens}
      POSTGRES_DB: ${POSTGRES_DB:-tracelens}
    ports: ['${INGESTION_PORT:-4001}:4001']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POSTGRES_HOST: postgres
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports: ['127.0.0.1:${FRONTEND_PORT:-5173}:5173']
    depends_on:
      api: { condition: service_healthy }

  # --- Observability stack ---
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      - api
      - ingestion

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-metrics.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
