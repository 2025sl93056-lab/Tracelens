# TraceLens full-stack dev environment.
#
# Status: Postgres, Adminer, and the ingestion + api services run out of the
# box. The frontend service remains a template below until it ships a Dockerfile.
#
#   docker compose up --build    # starts Postgres + Adminer + ingestion + api
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelens}
      POSTGRES_DB: ${POSTGRES_DB:-tracelens}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tracelens}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight web UI for inspecting the database during development.
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Application services (uncomment as each package gains a Dockerfile) ---
  #
  ingestion:
    build:
      context: .
      dockerfile: packages/ingestion/Dockerfile
    environment:
      INGESTION_PORT: ${INGESTION_PORT:-4001}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-dev-ingest-key}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-tracelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelens}
      POSTGRES_DB: ${POSTGRES_DB:-tracelens}
    ports: ['${INGESTION_PORT:-4001}:4001']
    depends_on:
      postgres: { condition: service_healthy }
  #
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      POSTGRES_HOST: postgres
    ports: ['${API_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
  #
  # frontend:
  #   build: ./packages/frontend
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:${API_PORT:-4000}
  #   ports: ['5173:5173']
  #   depends_on: [api]

volumes:
  pgdata:
